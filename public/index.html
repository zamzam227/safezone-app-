<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Safe-Zone App</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1765C0;--t:#16B8CF;--y:#FFC329;--bg:#F4F9FE;--c:#fff;--tx:#12305c;--mu:#5b7190;--ln:#d9e6f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1a30;--c:#14274a;--tx:#e8f1ff;--mu:#9db3d3;--ln:#25406b;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
header{background:var(--c);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.w{max-width:960px;margin:auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}
.top img{height:56px;width:auto;flex:none;cursor:pointer;border-radius:8px;background:#fff}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button,.tab{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:8px 12px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--b);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:20px;padding:20px;margin:16px 0}
h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;margin:.2em 0}h2{margin:.2em 0 .5em}h3{margin:0 0 .3em}
.hero{background:linear-gradient(135deg,var(--b),var(--t));color:#fff;border-radius:28px;padding:28px;margin:20px 0}
.hero p{max-width:46ch}
.btn{background:var(--y);color:#3a2a00;border:0;border-radius:99px;padding:11px 20px;font:inherit;font-weight:800;cursor:pointer}
.btn.s{background:var(--b);color:#fff}.btn.g{background:none;border:2px solid var(--b);color:var(--b)}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}
.err{color:#d33;font-weight:600;font-size:.9rem;min-height:1.2em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--b);color:#fff;font-size:.8rem;font-weight:700}
.note{background:#fff7dc;color:#5a4300;border-left:5px solid var(--y);padding:10px 14px;border-radius:10px;font-size:.9rem}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t));transition:width .5s}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:3px;background:var(--ln)}
.tl li.d:not(:last-child)::before{background:var(--t)}
.dot{width:40px;height:40px;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:1.1rem}
.tl .d .dot{background:var(--t);color:#fff}.tl .c .dot{background:var(--b);color:#fff;box-shadow:0 0 0 5px rgba(23,101,192,.25)}
.tl .f{opacity:.55}.tm{font-size:.82rem;color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;font-size:.92rem}
.scroll{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details{border:1px solid var(--ln);border-radius:14px;padding:10px 14px;margin:8px 0}summary{font-weight:700;cursor:pointer}
.moods button{font-size:1.8rem;background:none;border:3px solid transparent;border-radius:16px;cursor:pointer}.moods .on{border-color:var(--y)}
#br{width:150px;height:150px;border-radius:50%;background:var(--t);color:#fff;display:grid;place-items:center;font-weight:800;margin:14px auto;transition:transform 4s ease-in-out}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:24px 16px}
</style></head><body>
<header><div class="w top"><img id="lg" src="/logo.png" alt="Logo Safe-Zone App"><nav id="nav" aria-label="Navigasi utama"></nav><div id="who" class="row"></div></div></header>
<main class="w" id="m"></main>
<footer>Safe-Zone App · Suara Aman, Masa Depan Nyaman.</footer>
<script src="/app.js"></script></body></html>
